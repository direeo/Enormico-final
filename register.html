<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Register - Enormico</title>
  <link rel="stylesheet" href="register.css" />
  <link rel="stylesheet" href="app-theme.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display&display=swap" rel="stylesheet" />
</head>
<body>
  <div class="main-container">
    <aside class="auth-brand">
      <a class="auth-wordmark" href="landing.html">ENORMICO<span>.</span></a>
      <div class="auth-brand-copy"><p>POOLED INVESTING</p><h1>A clearer way to explore pooled investing.</h1></div>
      <img src="enormino.jpeg" alt="Illustration of investment growth" />
    </aside>
    <div class="register-box">
      <p class="auth-kicker">GET STARTED</p>
      <h2>Create your account</h2>
      <p class="auth-description">Set up your Enormico account.</p>
      <form id="registerForm" autocomplete="off">
        <div class="field"><label for="fullName">Full name</label>
        <input type="text" id="fullName" name="name" aria-describedby="nameError" placeholder="Full name" required />
        <small id="nameError" class="field-error" aria-live="polite"></small></div>
        <div class="field"><label for="email">Email address</label>
        <input type="email" id="email" name="email" autocomplete="email" aria-describedby="emailError" placeholder="Email Address" required />
        <small id="emailError" class="field-error" aria-live="polite"></small></div>
        <div class="field"><label for="newUsername">Username</label>
        <input type="text" id="newUsername" name="username" autocomplete="username" aria-describedby="usernameError" placeholder="Username" required />
        <small id="usernameError" class="field-error" aria-live="polite"></small></div>
        <div class="field field-wide"><label for="password">Password</label>
        <div class="password-control"><input type="password" id="password" name="password" autocomplete="new-password" minlength="8" aria-describedby="passwordRequirements passwordError" placeholder="Create a password" required /><button class="visibility-toggle" type="button" data-toggle-password="password" aria-label="Show password" aria-pressed="false">Show</button></div>
        <small id="passwordError" class="field-error" aria-live="polite"></small></div>
        <ul class="password-requirements" id="passwordRequirements" aria-label="Password requirements">
          <li id="requireLength" aria-live="polite">At least 8 characters</li>
          <li id="requireUpper" aria-live="polite">One uppercase letter</li>
          <li id="requireLower" aria-live="polite">One lowercase letter</li>
          <li id="requireNumber" aria-live="polite">One number</li>
          <li id="requireSpecial" aria-live="polite">One special character</li>
        </ul>
        <div class="field field-wide"><label for="confirmPassword">Confirm password</label>
        <div class="password-control"><input type="password" id="confirmPassword" name="confirmPassword" autocomplete="new-password" aria-describedby="confirmPasswordError" placeholder="Re-enter your password" required /><button class="visibility-toggle" type="button" data-toggle-password="confirmPassword" aria-label="Show confirmation password" aria-pressed="false">Show</button></div>
        <small id="confirmPasswordError" class="field-error" aria-live="polite"></small></div>
        <div class="field"><label for="phone">Phone number</label>
        <input type="tel" id="phone" name="phone" placeholder="Phone Number" /></div>
        <div class="field"><label for="dob">Date of birth</label>
        <input type="date" name="dob" id="dob" aria-describedby="dobError" required />
        <small id="dobError" class="field-error" aria-live="polite"></small></div>

        <p id="registerError" class="form-message" role="status" aria-live="polite" hidden></p>
        <button type="submit" class="submit-btn">Create account <span aria-hidden="true">→</span></button>
      </form>

      <p class="redirect-link">Already registered? <a href="index.html">Sign in</a></p>
    </div>
  </div>

  
  <script src="client.js"></script>
  <script src="register.js"></script>
</body>
</html>
