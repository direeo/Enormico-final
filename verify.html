<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Verify Email | Enormico</title>
  <link rel="stylesheet" href="signIn.css" />
  <link rel="stylesheet" href="app-theme.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display&display=swap" rel="stylesheet" />
</head>
<body>
  <main class="login-container">
    <aside class="auth-brand">
      <a class="auth-wordmark" href="landing.html">ENORMICO<span>.</span></a>
      <div class="auth-brand-copy"><p>ACCOUNT SECURITY</p><h1>One last step to secure your account.</h1></div>
      <img src="enormino.jpeg" alt="Illustration of investment growth" />
    </aside>
    <section class="auth-form-panel">
      <p class="auth-kicker">EMAIL VERIFICATION</p>
      <h2>Check your inbox</h2>
      <p class="auth-description">Enter the six-digit code sent to <strong id="verificationEmail"></strong>.</p>
      <form id="verifyForm">
        <label for="verificationCode">Verification code</label>
        <input id="verificationCode" name="code" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" aria-describedby="verifyMessage" required />
        <p id="verifyMessage" class="form-message" role="status" aria-live="polite" hidden></p>
        <button type="submit">Verify and create account <span aria-hidden="true">→</span></button>
      </form>
      <button id="resendCode" class="auth-secondary-button" type="button">Resend code</button>
      <p class="register-link"><a href="register.html">Back to registration</a></p>
    </section>
  </main>
  <script src="client.js"></script>
  <script src="verify.js"></script>
</body>
</html>
