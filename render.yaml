services:
  - type: web
    name: enormico
    runtime: node
    plan: starter
    buildCommand: npm ci && npm test
    startCommand: npm start
    healthCheckPath: /healthz
    disk:
      name: enormico-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_FILE
        value: /var/data/users.db
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: ENORMICO_ADMIN_EMAIL
        sync: false
      - key: ENORMICO_ADMIN_PASSWORD
        sync: false
